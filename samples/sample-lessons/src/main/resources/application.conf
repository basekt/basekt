ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [io.github.basekt.samples.lessons.LessonsKt.lessonsModule]
  }
}

basekt {
  basePath = /api
  # Images that lessons show, served by BaseKtFiles.
  files {
    path = /files
  }
  # The admin panel, where lessons are written in a visual Markdown editor. Sign in by pasting the token `demo-editor`.
  admin {
    path = /admin/api
  }
  adminUi {
    path = /admin
    apiPath = /admin/api
    brand.name = "Lessons"
  }
}
