ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [io.github.basekt.samples.shop.ShopKt.shopModule]
  }
}

basekt {
  basePath = /api
  pageSize {
    default = 20
    max = 100
  }
  admin {
    path = /admin/api
  }
  # The admin panel, reading the admin API above. Its theme is set in Kotlin (shopTheme).
  adminUi {
    path = /admin
    apiPath = /admin/api
  }
}

shop {
  # In-memory H2 by default. Point it at Postgres with SHOP_DATABASE_URL (and add the driver).
  database.url = "jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1"
  database.url = ${?SHOP_DATABASE_URL}

  # JWTs for real callers. The default secret is for trying the sample out only: set SHOP_JWT_SECRET anywhere else.
  jwt {
    issuer = "sample-shop"
    audience = "sample-shop"
    secret = "sample-shop-development-secret-not-for-production"
    secret = ${?SHOP_JWT_SECRET}
  }

  # Demo bearer tokens, for trying the sample out with curl.
  tokens = [
    {token = "staff-token", user = "sam", roles = [staff]}
    {token = "customer-token", user = "cus-1", roles = [customer]}
  ]
}
