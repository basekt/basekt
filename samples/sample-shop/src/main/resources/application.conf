ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [io.github.basekt.samples.shop.ShopKt.shopModule]
  }
}

basekt {
  basePath = /api
  pageSize {
    default = 20
    max = 100
  }
}

# Demo bearer tokens, for trying the sample out. A real app plugs in basekt-auth instead.
shop {
  tokens = [
    {token = "staff-token", user = "sam", roles = [staff]}
    {token = "customer-token", user = "cus-1", roles = [customer]}
  ]
}
