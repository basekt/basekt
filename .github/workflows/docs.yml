name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: [docs/**, zensical.toml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the site from zensical.toml and docs/, as Zensical documents for GitHub Pages.
  build:
    runs-on: ubuntu-latest
    steps:
      # Needs Pages enabled, so pull requests only build.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Deploys only from main. Pages must use GitHub Actions as its source (Settings → Pages).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
