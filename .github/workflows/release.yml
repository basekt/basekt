name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N), or running this workflow by hand with a version, builds and tests, publishes
# every library to Maven Central as io.github.basekt:<module>:X.Y.Z, and creates the GitHub release. A run by hand
# releases the branch it runs on and tags that commit only after the upload. See RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 1.2.3 or 1.2.3-rc.1. The tag v<version> must not exist yet."
        required: true
        type: string

permissions:
  contents: write   # to create the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' isn't a version like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::The tag v$version already exists. A version can't be released twice."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check the publishing secrets
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          missing=()
          [[ -n $USERNAME ]] || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n $PASSWORD ]] || missing+=(MAVEN_CENTRAL_PASSWORD)
          # Maven Central rejects unsigned artifacts, so a release without a key fails here, not after the upload.
          [[ -n $SIGNING_KEY ]] || missing+=(GPG_SIGNING_KEY)
          if (( ${#missing[@]} )); then echo "::error::Missing repository secrets: ${missing[*]} (see RELEASING.md)"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Node builds the admin panel (admin/basekt-admin-ui/web) into its jar.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/basekt-admin-ui/web/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Pbasekt.version=${{ steps.version.outputs.version }} --no-daemon

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >
          ./gradlew publishAndReleaseToMavenCentral
          -Pbasekt.version=${{ steps.version.outputs.version }}
          --no-configuration-cache --no-daemon

      # A run by hand tags the commit it built, once the upload has worked, so a failed run leaves no tag behind.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prerelease=""
          [[ $VERSION == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --title "$TAG" --generate-notes $prerelease
