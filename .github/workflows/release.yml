name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) builds and tests, publishes every library to Maven Central as
# io.github.basekt:<module>:X.Y.Z, and creates the GitHub release. See RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write   # to create the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' isn't a version tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the publishing secrets
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          missing=()
          [[ -n $USERNAME ]] || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n $PASSWORD ]] || missing+=(MAVEN_CENTRAL_PASSWORD)
          # Maven Central rejects unsigned artifacts, so a release without a key fails here, not after the upload.
          [[ -n $SIGNING_KEY ]] || missing+=(GPG_SIGNING_KEY)
          if (( ${#missing[@]} )); then echo "::error::Missing repository secrets: ${missing[*]} (see RELEASING.md)"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Pbasekt.version=${{ steps.version.outputs.version }} --no-daemon

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: >
          ./gradlew publishAndReleaseToMavenCentral
          -Pbasekt.version=${{ steps.version.outputs.version }}
          --no-configuration-cache --no-daemon

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          [[ $VERSION == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
