name: Snapshot

# Every push to main publishes the libraries to Maven Central's snapshots repository as
# io.github.basekt:<module>:<basekt.version from gradle.properties, a -SNAPSHOT>. Snapshots aren't signed, can be
# replaced, and expire; tagged releases go through release.yml. See RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is a snapshot
        run: |
          version="$(grep '^basekt.version=' gradle.properties | cut -d= -f2)"
          if [[ $version != *-SNAPSHOT ]]; then
            echo "::error::basekt.version is '$version'; main must hold the next -SNAPSHOT (releases are tags)."; exit 1
          fi
          echo "Publishing $version"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish the snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
